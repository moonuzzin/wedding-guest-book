<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b9e9ff">
<title>웨딩빌리지 : 결혼식장</title>
<meta property="og:title" content="웨딩빌리지 : 결혼식장">
<meta property="og:description" content="찍어주신 사진을 여기에 남겨주세요 ♥">
<meta property="og:image" content="assets/map.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7 6' shape-rendering='crispEdges'%3E%3Cpath fill='%23ff6f9f' d='M1 0h2v1h1V0h2v1h1v2H6v1H5v1H4v1H3V5H2V4H1V3H0V1h1z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">

  <section class="stage">
    <canvas id="game" aria-label="결혼식장 맵. 화살표 버튼으로 내 캐릭터를 움직일 수 있어요."></canvas>
    <div class="mapname" aria-hidden="true">
      <small>웨딩빌리지</small>
      <b><span data-groom></span> <i>♥</i> <span data-bride></span></b>
    </div>
    <div class="pad left">
      <button data-key="left" aria-label="왼쪽">◀</button>
      <button data-key="right" aria-label="오른쪽">▶</button>
    </div>
    <div class="pad right">
      <button data-key="down" class="small" aria-label="엎드리기">▼</button>
      <button data-key="jump" class="jump" aria-label="점프">점프</button>
    </div>
  </section>

  <section class="npc win">
    <img src="assets/groom.png" alt="" class="face g"><img src="assets/bride.png" alt="" class="face b">
    <div class="npc-text">
      <p class="who"><span data-groom></span> &amp; <span data-bride></span> <em data-date></em></p>
      <p>귀한 걸음 해주셔서 정말 감사합니다!<br>
      오늘 찍어주신 저희 사진, <b>여기에 올려주시면</b><br>오래오래 소중히 간직하겠습니다.<br>
      다시 한 번 감사드립니다!!</p>
    </div>
  </section>

  <section class="win" id="photos">
    <h2 class="bar">사진 보관함 <span class="cnt" id="cnt">0</span></h2>
    <div class="body">
      <label class="field"><span>올린 사람 <small>(선택)</small></span>
        <input type="text" class="nick" maxlength="20" placeholder="이름을 남기면 누가 찍었는지 알 수 있어요" autocomplete="nickname">
      </label>
      <label class="btn big">
        <input type="file" id="file" accept="image/*" multiple hidden>
        📷 사진 올리기
      </label>
      <div class="exp" id="exp" hidden><i></i><span>EXP</span><em id="expText"></em></div>
      <button class="btn retry" id="retry" hidden>실패한 사진 다시 올리기</button>
      <div class="inv" id="inv" aria-label="내가 올린 사진"></div>
      <p class="hint">여러 장을 한 번에 골라도 돼요. 올린 사진은 신랑·신부만 볼 수 있어요.</p>
    </div>
  </section>

  <section class="win" id="guestbook">
    <h2 class="bar">방명록 <small>(쓰고 싶은 분만!)</small></h2>
    <form class="body" id="gbForm">
      <label class="field">이름
        <input type="text" class="nick" maxlength="20" placeholder="익명의 하객" autocomplete="nickname">
      </label>
      <label class="field">한마디
        <textarea name="msg" maxlength="200" rows="3" placeholder="축하 한마디 남겨주세요. 맵에서 내 캐릭터가 말해줘요!" required></textarea>
      </label>
      <button class="btn big" type="submit">남기기</button>
    </form>
    <ol class="gb" id="gbList"></ol>
  </section>

  <footer>
    <p data-date></p>
    <p class="demo" id="demo" hidden>체험 모드 · 아직 서버가 연결되지 않아 이 기기에만 저장돼요</p>
  </footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="game.js"></script>
<script src="app.js"></script>
</body>
</html>
